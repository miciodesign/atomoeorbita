name: Foto della mappa

# Cerca su Wikidata e Wikimedia Commons le foto dei punti della mappa
# e salva link, autore e licenza in _src/data/foto.json.
on:
  push:
    paths:
      - "_src/foto_mappa.py"
      - ".github/workflows/foto.yml"
      - "_src/content/articoli/**"
  workflow_dispatch:

permissions:
  contents: write

# Un solo aggiornamento foto alla volta: i push ravvicinati non si scontrano più
concurrency:
  group: foto
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install markdown jinja2 pillow
      - name: Cerca le foto
        run: python _src/foto_mappa.py
      - name: Pubblica
        run: |
          git config user.name "Atomo e Orbita"
          git config user.email "redazione@atomoeorbita.it"
          git add _src/data/foto.json _src/static/foto
          git stash
          git pull --rebase origin main
          git stash pop || true
          python _src/build.py
          git add -A
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "Foto della mappa da Wikimedia Commons"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rifiutato, riprovo ($i)"; sleep $((i*10))
            git pull --rebase origin main || { git rebase --abort; git pull --rebase -X theirs origin main; }
            python _src/build.py && git add -A && (git diff --cached --quiet || git commit -m "Ricostruzione dopo aggiornamento")
          done
          exit 1
