name: trascrivi
on:
  workflow_dispatch:
  push:
    branches: [trascrizione]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install faster-whisper
      - run: |
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m=WhisperModel("small",compute_type="int8")
          segs,_=m.transcribe("voce.mp3",language="it",word_timestamps=True)
          out=[{"w":w.word,"s":round(w.start,2),"e":round(w.end,2)} for s in segs for w in s.words]
          json.dump(out,open("parole.json","w"),ensure_ascii=False,indent=0)
          PY
      - run: |
          git config user.name "Atomo e Orbita"; git config user.email "redazione@atomoeorbita.it"
          git add parole.json; git commit -m "Trascrizione [skip ci]"; git push
